name: Build ryzn SA-MP APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (defaults to latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Native JNI, Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-30
            build-tools;30.0.1

      - name: Cache & Install Android NDK r17c
        id: cache_ndk
        uses: actions/cache@v4
        with:
          path: ~/.ndk/android-ndk-r17c
          key: ndk-r17c-linux-x86_64

      - name: Download Android NDK r17c if not cached
        if: steps.cache_ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.ndk
          curl -fsSL -o /tmp/android-ndk-r17c-linux-x86_64.zip \
            https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q /tmp/android-ndk-r17c-linux-x86_64.zip -d ~/.ndk
          rm -f /tmp/android-ndk-r17c-linux-x86_64.zip

      - name: Build libsampvoice.so with NDK r17c
        run: |
          rm -rf /tmp/jni_build_src "Jni source/obj" "Jni source/libs"
          cp -a "Jni source" /tmp/jni_build_src
          "${HOME}/.ndk/android-ndk-r17c/ndk-build" \
            -C /tmp/jni_build_src/jni \
            NDK_PROJECT_PATH=/tmp/jni_build_src \
            NDK_APPLICATION_MK=/tmp/jni_build_src/jni/Application.mk \
            APP_BUILD_SCRIPT=/tmp/jni_build_src/jni/Android.mk \
            -j"$(nproc)"
          test -f /tmp/jni_build_src/libs/armeabi-v7a/libsampvoice.so
          cp -f /tmp/jni_build_src/libs/armeabi-v7a/libsampvoice.so "app/src/main/jniLibs/armeabi-v7a/libsampvoice.so"
          rm -rf /tmp/jni_build_src
          strings "app/src/main/jniLibs/armeabi-v7a/libsampvoice.so" | grep -E "ryznSAMP|ryzn SA-MP"

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configure local.properties & Gradle wrapper
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=${SDK_DIR}" > local.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug and Release APKs
        run: ./gradlew clean assembleDebug assembleRelease --stacktrace

      - name: Verify APK outputs & signatures
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="${SDK_DIR}/build-tools/30.0.1/apksigner"
          ZIPALIGN="${SDK_DIR}/build-tools/30.0.1/zipalign"
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          "$ZIPALIGN" -c -v 4 app/build/outputs/apk/release/app-release.apk | tail -n 5
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "AndroidManifest\.xml|classes.*\.dex|lib/armeabi-v7a/"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ryzn-samp-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Determine Release Metadata
        if: github.event_name != 'pull_request'
        id: release_meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Remove stale unsigned APK asset if present
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: gh release delete-asset "$TAG" app-release-unsigned.apk -y 2>/dev/null || true

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "ryzn SA-MP APK (${{ steps.release_meta.outputs.tag }})"
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
