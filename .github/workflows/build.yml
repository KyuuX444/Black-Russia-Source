name: Build Ryzn SA-MP APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (defaults to latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Native C++ (2.00) Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, NDK 25.1 & CMake 3.22.1
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;25.1.8937393
            cmake;3.22.1

      - name: Configure local.properties & Gradle wrapper
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=${SDK_DIR}" > local.properties
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Verify APK outputs, native libs & signatures
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="${SDK_DIR}/build-tools/35.0.0/apksigner"
          ZIPALIGN="${SDK_DIR}/build-tools/35.0.0/zipalign"
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          "$ZIPALIGN" -c -v 4 app/build/outputs/apk/release/app-release.apk | tail -n 5
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "AndroidManifest\.xml|classes.*\.dex|lib/(armeabi-v7a|arm64-v8a)/"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ryzn-samp-apks
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Determine Release Metadata
        if: github.event_name != 'pull_request'
        id: release_meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Remove stale APK assets if present
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          gh release delete-asset "$TAG" app-release-unsigned.apk -y 2>/dev/null || true
          gh release delete-asset "$TAG" app-debug.apk -y 2>/dev/null || true

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Ryzn SA-MP APK (${{ steps.release_meta.outputs.tag }})"
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
