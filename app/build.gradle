apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.1"

    defaultConfig {
        minSdk 23
        targetSdkVersion 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        applicationId 'com.ryzn.samp'
        versionName "1.0-ryzn"
        versionCode 10
        vectorDrawables.useSupportLibrary = true

        multiDexEnabled = true

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }
    signingConfigs {
        release {
            def envPath = System.getenv("KEYSTORE_PATH")
            storeFile envPath ? file(envPath) : file("${rootDir}/keystore/ryzn-samp-release.jks")
            storePassword System.getenv("STORE_PASSWORD") ?: "blackrussia123"
            keyAlias System.getenv("KEY_ALIAS") ?: "blackrussia"
            keyPassword System.getenv("KEY_PASSWORD") ?: "blackrussia123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        exclude 'dump_syms/**'
        exclude 'META-INF/*.kotlin_module'
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "com.github.skydoves:colorpickerpreference:2.0.4"
    implementation 'ru.egslava:MaskedEditText:1.0.5'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    testImplementation 'junit:junit:4.12'
}
