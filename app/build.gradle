plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ryzn.game'
    compileSdk 35
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId 'com.ryzn.samp'
        minSdk 23
        targetSdk 28
        versionCode 20
        versionName '2.0-ryzn'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        resourceConfigurations += ['en', 'in']
    }

    signingConfigs {
        release {
            def envPath = System.getenv("KEYSTORE_PATH")
            storeFile envPath ? file(envPath) : file("${rootDir}/keystore/ryzn-samp-release.jks")
            storePassword System.getenv("STORE_PASSWORD") ?: "blackrussia123"
            keyAlias System.getenv("KEY_ALIAS") ?: "blackrussia"
            keyPassword System.getenv("KEY_PASSWORD") ?: "blackrussia123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'dump_syms/**',
                'META-INF/*.kotlin_module',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/*.version',
                'kotlin/**'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', includes: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.ini4j:ini4j:0.5.4'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'
    testImplementation 'junit:junit:4.13.2'
}
